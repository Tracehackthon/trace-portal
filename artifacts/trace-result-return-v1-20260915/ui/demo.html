<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trace · 结果回来 · 隔离示例</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E"><link rel="stylesheet" href="./result-return.css"><style>html,body{margin:0;width:100%;height:100%}#demo-root{width:100%;height:100%}#fixture-tools{position:fixed;bottom:5px;left:80px;z-index:30;font:12px/1.5 system-ui;color:#365d4c}#fixture-tools summary{cursor:pointer}#fixture-tools>div{display:flex;gap:7px;align-items:center;background:#fafff4f5;border:1px solid #b5cfc2;border-radius:12px;padding:11px;max-width:calc(100vw - 100px);flex-wrap:wrap}#fixture-tools label{display:flex;gap:6px;align-items:center}#fixture-tools button,#fixture-tools select{font:inherit;padding:5px 8px;color:#214c3b}#fixture-note{max-width:400px}</style></head><body><div id="demo-root"></div><details id="fixture-tools"><summary>隔离示例控制 · 不写入应用</summary><div><label>画面<select id="fixture-screen"><option value="intake">结果带入</option><option value="comparison">比较展开</option><option value="impact">影响辨认</option><option value="revision">修订确认</option><option value="completed">回接完成</option></select></label><button id="fixture-reset">重置示例</button><label>下次模拟回执<select id="fixture-mode"><option value="success">成功</option><option value="failure">失败</option><option value="conflict">版本冲突</option><option value="manual">手动等待</option></select></label><button id="fixture-receipt">发送匹配成功回执</button><span id="fixture-note">仅隔离内存宿主，不是实际保存。</span></div></details><script type="module" src="./demo.mjs"></script></body></html>
