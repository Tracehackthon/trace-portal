name: Vercel Deploy

on:
  push:
    branches: [chore/vercel-actions]
  workflow_dispatch:

permissions:
  contents: read

# Do not cancel an upload that may already be changing a Preview alias.
# The pre-deploy branch-head check skips an obsolete queued build instead.
concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/chore/vercel-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: preview
      VERCEL_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check deployment credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.TRACEPORTAL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo '::error::Set VERCEL_TOKEN (or TRACEPORTAL), VERCEL_ORG_ID and VERCEL_PROJECT_ID in repository Actions secrets.'
            exit 1
          fi
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.17.0
      - name: Pull project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.TRACEPORTAL }}
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
      - name: Test and build once
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.TRACEPORTAL }}
        run: |
          # vercel.json runs npm ci, the 96 tests, TypeScript, and Vite.
          vercel build --token="$VERCEL_TOKEN"
      - name: Verify browser-local persistence before deployment
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser-storage
      - name: Check branch is still current
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits" --method GET -f sha="$BRANCH" -f per_page=1 --jq '.[0].sha')
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit exists; this build passed but will not replace it.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy verified artifact
        if: steps.head.outputs.current == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.TRACEPORTAL }}
        run: |
          # This command creates only a Preview deployment.
          url=$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN" --meta gitCommitSha="$GITHUB_SHA")
          printf '### Vercel deployment\n\n- Environment: %s\n- Commit: `%s`\n- URL: %s\n' "$VERCEL_ENV" "$GITHUB_SHA" "$url" >> "$GITHUB_STEP_SUMMARY"
